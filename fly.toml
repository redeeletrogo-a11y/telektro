app = "telektro-ocpp-gateway"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "apps/ocpp-gateway/Dockerfile"

[env]
  NODE_ENV = "production"
  OCPP_GATEWAY_PORT = "9000"
  OCPP_HEARTBEAT_INTERVAL_SECONDS = "60"

# Port 443: normal wss/https -> gateway on 9000 (health check on /health).
[[services]]
  protocol = "tcp"
  internal_port = 9000
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[services.ports]]
    port = 443
    handlers = ["http", "tls"]

  [[services.http_checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# TEMPORARY DIAGNOSTIC: port 80 is WS-only, plain ws:// (no https redirect) -> 9001.
# Nothing listens on 9001 unless the secret ENABLE_INSECURE_WS=true is set.
[[services]]
  protocol = "tcp"
  internal_port = 9001
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
