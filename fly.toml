app = "telektro-ocpp-gateway"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "apps/ocpp-gateway/Dockerfile"

[env]
  NODE_ENV = "production"
  OCPP_GATEWAY_PORT = "9000"
  OCPP_HEARTBEAT_INTERVAL_SECONDS = "60"

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
